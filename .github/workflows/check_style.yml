name: Check code style with prettier

on: [pull_request]

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Check style
        run: yarn prettier -c ./src/
