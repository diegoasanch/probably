name: Run jest tests

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Test
        run: CI=true yarn test
